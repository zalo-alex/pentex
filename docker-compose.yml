services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:5000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./instance:/app/instance
      - ./logs:/app/logs
      # Optional: enable AI translation (see README's "AI translation settings").
      # Only uncomment once llm-config.json exists on the host — Docker creates
      # an empty directory at the target if the source file is missing, which
      # breaks the app's config loader.
      # - ./llm-config.json:/app/llm-config.json:ro
    restart: unless-stopped
